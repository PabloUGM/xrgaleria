<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto AR clases</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('hdri-environment', {
        schema: {
          src: { type: 'string', default: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr' }
        },

        init: async function () {
          try {
            const { HDRLoader } = await import('https://esm.sh/three@0.184.0/examples/jsm/loaders/HDRLoader.js');
            const hdrTexture = await new HDRLoader().loadAsync(this.data.src);
            const scene = this.el.object3D;
            const renderer = this.el.renderer;
            const pmremGenerator = new THREE.PMREMGenerator(renderer);

            hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
            this.environment = pmremGenerator.fromEquirectangular(hdrTexture);
            scene.environment = this.environment.texture;
            scene.background = hdrTexture;
            pmremGenerator.dispose();
          } catch (error) {
            console.error('No se pudo cargar el entorno HDRI:', error);
          }
        },

        remove: function () {
          if (this.environment) this.environment.dispose();
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" color="#26A9CB"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25"></a-sphere>
      <a-plane rotation="-90 0 0" width="8" height="8"></a-plane>
      <a-sky color="#222D62"></a-sky>
    </a-scene>
  </body>
</html>
