<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto AR clases</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/aframe-three-bridge.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="ui">
      <div class="ui-panel">
        <div id="ar-status" class="info" aria-live="polite">Presiona «Iniciar AR» y apunta a una superficie plana para colocar el personaje.</div>
        <button id="ar-button" type="button">Iniciar AR</button>
        <button id="rotation-button" type="button">Iniciar rotación</button>
        <button id="anima" type="button">Animación</button>
      </div>
    </div>
    <a-scene
      shadow="type: pcf"
      renderer="colorManagement: true; antialias: true"
      room-interior-hdri xr-mode-ui="enabled: false"
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: hit-test, anchors, dom-overlay; overlayElement: #ui"
      ar-hit-test="target: #modelo">
      <a-assets>
         <a-asset-item id="perso" src="assets/modeloanimado.glb"></a-asset-item>
         <!-- <audio id="sonido" src="assets/brillo.mp3"></audio> -->
      </a-assets>
<!-- OBJETOS EN ESCENA -->
      <a-entity id="objetos">
        <!-- Sonido pendiente: habilitar cuando se defina y cargue el recurso #sonido. -->
        <!-- sound="src: #sonido; on: rotation-start; positional: true" -->
        <a-entity id="modelo" gltf-model="#perso" 
                  position="0 0 -2" 
                  scale="1.7 1.7 1.7" 
                  animation-mixer="clip: idle; loop: repeat; timeScale: 2"
                  hide-on-enter-ar
                  shadow="cast: true; receive: true" 
                  animation__rotation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 6000; easing: linear; loop: true; startEvents: rotation-start; pauseEvents: rotation-pause; resumeEvents: rotation-resume">
        </a-entity>
      </a-entity>

      <a-ring
        id="marcador"
        color="#ff4ea1"
        radius-inner="0.08"
        radius-outer="0.12"
        rotation="-90 0 0"
        visible="false"
        material="opacity: 0.9; transparent: true">
      </a-ring>

      <!-- Texto de prueba de iluminación; no forma parte de la escena actual. -->
      <!-- <a-text value="Test iluminación" font="https://cdn.aframe.io/fonts/mozillavr.fnt" position="0 3 -4" align="center" width="4" color="#222D62" hide-on-enter-ar></a-text> -->
<!-- LUCES -->
       <a-light type="directional" 
               position="10 15 5" 
               color="white" 
               intensity="1" 
               light="castShadow: true; shadowBias: -0.0001" 
               shadow-camera-automatic="#objetos">
      </a-light> 
      <a-light type="ambient"  color="white" intensity="1.5" ></a-light> 
       <a-light type="point" position="0 3 -4" color="#ffd9b3" intensity="1.4" distance="15"></a-light> 
<!-- ESCENA -->
      <a-camera fov="50" position="0 1.2 2" wasd-controls></a-camera>
      <a-plane color="#d9d9d9" rotation="-90 0 0" width="8" height="8" shadow="receive: true" hide-on-enter-ar></a-plane>
      <a-sky color="lightblue" hide-on-enter-ar></a-sky>
    </a-scene>
    <!-- CONTROLES DE UI -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
