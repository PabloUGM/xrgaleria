<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto AR clases</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/aframe-three-bridge.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="ui">
      <div class="ui-panel is-start-screen">
        <div id="ar-status" class="info" aria-live="polite" hidden></div>
        <button id="ar-button" type="button" disabled>Comprobando AR…</button>
        <button id="rotation-button" type="button" hidden>Iniciar rotación</button>
        <button id="anima" type="button" hidden>Cambiar animación</button>
      </div>
    </div>
    <a-scene
      shadow="type: pcf"
      renderer="colorManagement: true; antialias: true"
      room-interior-hdri xr-mode-ui="enabled: false"
      webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: hit-test, anchors, dom-overlay; overlayElement: #ui"
      ar-hit-test="target: #modelo">
      <a-assets>
         <a-asset-item id="perso" src="assets/animacionb.glb"></a-asset-item>
         <!-- <audio id="sonido" src="assets/brillo.mp3"></audio> -->
      </a-assets>
<!-- OBJETOS EN ESCENA -->
      <a-entity id="objetos">
        <!-- Sonido pendiente: habilitar cuando se defina y cargue el recurso #sonido. -->
        <!-- sound="src: #sonido; on: rotation-start; positional: true" -->
        <a-entity id="modelo" gltf-model="#perso" 
                  position="0 0 -2" 
                  scale="1.7 1.7 1.7" 
                  animation-mixer="clip: look_around; loop: repeat; timeScale: 1; crossFadeDuration: 0.3"
                  rotation-controller="speed: 60"
                  hide-on-enter-ar
                  shadow="cast: true; receive: true">
        </a-entity>
      </a-entity>

      <a-entity id="marcador" ar-pulse-marker visible="false">
        <a-ring
          color="#ff4ea1"
          radius-inner="0.18"
          radius-outer="0.22"
          rotation="-90 0 0"
          material="opacity: 0.9; transparent: true; side: double"
          animation__scale="property: scale; from: 0.2 0.2 0.2; to: 2.8 2.8 2.8; dur: 1800; easing: linear; loop: true"
          animation__fade="property: material.opacity; from: 0.9; to: 0; dur: 1800; easing: linear; loop: true">
        </a-ring>
        <a-ring
          color="#ff4ea1"
          radius-inner="0.18"
          radius-outer="0.22"
          rotation="-90 0 0"
          material="opacity: 0.9; transparent: true; side: double"
          animation__scale="property: scale; from: 0.2 0.2 0.2; to: 2.8 2.8 2.8; dur: 1800; easing: linear; loop: true; delay: 600"
          animation__fade="property: material.opacity; from: 0.9; to: 0; dur: 1800; easing: linear; loop: true; delay: 600">
        </a-ring>
        <a-ring
          color="#ff4ea1"
          radius-inner="0.18"
          radius-outer="0.22"
          rotation="-90 0 0"
          material="opacity: 0.9; transparent: true; side: double"
          animation__scale="property: scale; from: 0.2 0.2 0.2; to: 2.8 2.8 2.8; dur: 1800; easing: linear; loop: true; delay: 1200"
          animation__fade="property: material.opacity; from: 0.9; to: 0; dur: 1800; easing: linear; loop: true; delay: 1200">
        </a-ring>
      </a-entity>

      <!-- Texto de prueba de iluminación; no forma parte de la escena actual. -->
      <!-- <a-text value="Test iluminación" font="https://cdn.aframe.io/fonts/mozillavr.fnt" position="0 3 -4" align="center" width="4" color="#222D62" hide-on-enter-ar></a-text> -->
<!-- LUCES -->
       <a-light type="directional" 
               position="10 15 5" 
               color="white" 
               intensity="1" 
               light="castShadow: true; shadowBias: -0.0001" 
               shadow-camera-automatic="#objetos">
      </a-light> 
      <a-light type="ambient"  color="white" intensity="1.5" ></a-light> 
       <a-light type="point" position="0 3 -4" color="#ffd9b3" intensity="1.4" distance="15"></a-light> 
<!-- ESCENA -->
      <a-camera fov="50" position="0 1.2 2" wasd-controls></a-camera>
      <a-cylinder
        id="plataforma"
        position="0 -0.06 -2"
        radius="1.45"
        height="0.12"
        segments-radial="64"
        material="color: #c4cbd4; roughness: 0.9; metalness: 0.05"
        shadow="cast: true; receive: true"
        hide-on-enter-ar>
      </a-cylinder>
      <a-sky color="#555b65" hide-on-enter-ar></a-sky>
    </a-scene>
    <!-- CONTROLES DE UI -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
