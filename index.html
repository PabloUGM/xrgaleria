<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto AR clases</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene stats>
      <a-assets>
          <a-asset-item id="silla" src="assets/silla.glb"></a-asset-item>
      </a-assets>
      <a-entity gltf-model="#silla" position="0 0 -2" scale="1 1 1"></a-entity>
    
      <a-plane rotation="-90 0 0" width="8" height="8"></a-plane>
      <a-sky color="blue"></a-sky>
    </a-scene>
  </body>
</html>
